name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test-backend:
    name: Test Backend
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore Akira.slnx

    - name: Build
      run: dotnet build Akira.slnx --no-restore --configuration Release

    - name: Test
      run: dotnet test Akira.slnx --no-build --configuration Release --verbosity normal --filter "Category!=Integration"

  test-integration:
    name: Test Integration
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json

    - name: Restore dependencies
      run: dotnet restore Akira.slnx

    - name: Build
      run: dotnet build Akira.slnx --no-restore --configuration Release

    - name: Install ffmpeg
      run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

    - name: Test (MariaDB in Testcontainers, ffprobe)
      run: dotnet test Akira.slnx --no-build --configuration Release --verbosity normal --filter "Category=Integration"

  test-admin:
    name: Test admin UI
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24.19'
        cache: npm
        cache-dependency-path: Akira.Client/package-lock.json

    - name: Install
      working-directory: Akira.Client
      run: npm ci --no-audit --no-fund

    - name: Type check and build
      working-directory: Akira.Client
      run: npm run build

  build-guide:
    name: Build guide
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '24.19'
        cache: npm
        cache-dependency-path: Akira.Docs/package-lock.json

    - name: Install
      working-directory: Akira.Docs
      run: npm ci --no-audit --no-fund

    - name: Build (fails on a dead link)
      working-directory: Akira.Docs
      run: npm run build

  build-image:
    name: Build Docker Image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Build
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Akira.Server/Dockerfile
        push: false

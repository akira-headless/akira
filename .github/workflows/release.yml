name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write
  packages: write

jobs:
  release:
    name: Publish the server image
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Sign in to the GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # v1.2.3 becomes 1.2.3, 1.2 and latest; a pre-release such as v1.2.3-rc.1 only gets its own tag
    - name: Tags
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: Akira.Server/Dockerfile
        platforms: linux/amd64,linux/arm64
        build-args: |
          GPU_DRIVERS=intel,amd,nvidia
          VERSION=${{ steps.meta.outputs.version }}
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Create the GitHub release
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        if [[ "$TAG" == *-* ]]; then prerelease=--prerelease; fi
        gh release create "$TAG" --verify-tag --generate-notes $prerelease

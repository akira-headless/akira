name: Guide

on:
  push:
    branches: [ main ]
    paths: [ 'Akira.Docs/**', '.github/workflows/pages.yml' ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the guide
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Set up Node
      uses: actions/setup-node@v4
      with:
        node-version: '24.19'
        cache: npm
        cache-dependency-path: Akira.Docs/package-lock.json

    - name: Install
      working-directory: Akira.Docs
      run: npm ci --no-audit --no-fund

    # Pages serves the guide under the repository's name, the guide image at the root
    - name: Build
      working-directory: Akira.Docs
      env:
        DOCS_BASE: /${{ github.event.repository.name }}/
      run: npm run build

    - uses: actions/configure-pages@v5

    - uses: actions/upload-pages-artifact@v3
      with:
        path: Akira.Docs/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
    - id: deployment
      uses: actions/deploy-pages@v4

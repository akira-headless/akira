services:
  akira:
    environment:
      - Database__Provider=MariaDb
      - Database__Host=mariadb
      - Database__Port=3306
      - Database__Name=akira
      - Database__Username=akira
      - Database__Password=${DB_PASSWORD:?Set DB_PASSWORD}
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    container_name: akira-mariadb
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      - MARIADB_DATABASE=akira
      - MARIADB_USER=akira
      - MARIADB_PASSWORD=${DB_PASSWORD:?Set DB_PASSWORD}
      - MARIADB_RANDOM_ROOT_PASSWORD=1
    volumes:
      - akira_mariadb:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  akira_mariadb:
